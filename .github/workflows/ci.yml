name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk xvfb
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Smoke test the Windows window
        if: runner.os == 'Windows'
        run: python tests/smoke_window.py
      - name: Smoke test the Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke_window.py
      - name: Check the Start menu installer
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\install-windows.cmd
      - name: Check the Linux installer
        if: runner.os == 'Linux'
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/encoder-install"
          bash scripts/install-linux.sh
          test -x "$XDG_DATA_HOME/localsend-encoder/launch"
          test -f "$XDG_DATA_HOME/applications/localsend-encoder.desktop"
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Build universal app and archive
        run: |
          ENCODER_MAC_ARCH=universal ./scripts/build-macos.sh
          ditto -c -k --sequesterRsrc --keepParent 'dist/LocalSend Encoder.app' dist/LocalSend-Encoder-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSend-Encoder-macOS
          path: dist/LocalSend-Encoder-macOS.zip
