name: Release one-line installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to install
        required: true
        default: v1.2.0
        type: string

permissions:
  contents: read

env:
  INSTALL_TAG: ${{ inputs.tag }}

jobs:
  macos:
    runs-on: macos-26
    steps:
      - name: Install from the public tag
        shell: bash
        run: |
          [[ "$INSTALL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          export ENCODER_APPLICATIONS_DIR="$RUNNER_TEMP/Applications"
          mkdir -p "$ENCODER_APPLICATIONS_DIR"
          repo="$GITHUB_REPOSITORY"; tag="$INSTALL_TAG"; curl -fsSL "https://raw.githubusercontent.com/$repo/$tag/scripts/bootstrap-unix.sh" | bash -s -- "https://github.com/$repo/archive/refs/tags/$tag.tar.gz"
          app="$ENCODER_APPLICATIONS_DIR/LocalSend Encoder.app"
          codesign --verify --strict "$app"
          test -x "$app/Contents/MacOS/LocalSend Encoder"
          test -s "$app/Contents/Resources/LocalSendEncoder.icns"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install from the public tag
        shell: bash
        run: |
          [[ "$INSTALL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          export XDG_DATA_HOME="$RUNNER_TEMP/encoder-install"
          repo="$GITHUB_REPOSITORY"; tag="$INSTALL_TAG"; curl -fsSL "https://raw.githubusercontent.com/$repo/$tag/scripts/bootstrap-unix.sh" | bash -s -- "https://github.com/$repo/archive/refs/tags/$tag.tar.gz"
          test -x "$XDG_DATA_HOME/localsend-encoder/launch"
          test -f "$XDG_DATA_HOME/applications/localsend-encoder.desktop"
          "$XDG_DATA_HOME/localsend-encoder/venv/bin/python" -c 'import tkinter, send2trash'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Provide FFmpeg on the Windows Server runner
        run: choco install ffmpeg -y --no-progress
      - name: Install from the public tag
        shell: powershell
        run: |
          if ($env:INSTALL_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$') { throw 'Invalid tag' }
          $repo=$env:GITHUB_REPOSITORY; $tag=$env:INSTALL_TAG; & ([scriptblock]::Create((Invoke-RestMethod "https://raw.githubusercontent.com/$repo/$tag/scripts/bootstrap-windows.ps1"))) "https://github.com/$repo/archive/refs/tags/$tag.zip"
          $root = Join-Path $env:LOCALAPPDATA 'Programs\LocalSend Encoder'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'LocalSend Encoder.lnk'
          if (!(Test-Path $shortcut) -or !(Test-Path (Join-Path $root 'portable\app.py'))) { throw 'App or Start menu shortcut was missed' }
          & (Join-Path $root 'venv\Scripts\python.exe') -c 'import tkinter, send2trash'
          if ($LASTEXITCODE -ne 0) { throw 'Application environment failed' }
